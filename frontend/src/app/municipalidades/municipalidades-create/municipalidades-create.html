<h2>{{ id ? 'Editar municipalidad' : 'Nueva municipalidad' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()" class="formulario">
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="nombre" />
    <mat-error>El nombre es obligatorio</mat-error>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Dirección</mat-label>
    <input matInput formControlName="direccion" />
  </mat-form-field>

  <div class="botones">
    <a mat-button routerLink="/municipalidades">Cancelar</a>
    <button mat-flat-button type="submit">Guardar</button>
  </div>
</form>
