@if (acceso(); as a) {
  <div class="encabezado">
    <h2>Acceso {{ a.nombre }}</h2>
    <div class="fila">
      <a mat-button [routerLink]="['/accesos', 'editar', id]"><mat-icon>edit</mat-icon> Editar</a>
      <a mat-button routerLink="/accesos"><mat-icon>arrow_back</mat-icon> Volver</a>
    </div>
  </div>

  <mat-card appearance="outlined" class="tarjeta">
    <mat-card-content>
      <p><strong>Nombre:</strong> {{ a.nombre }}</p>
      <p><strong>Estación:</strong> {{ nombreEstacion(a.id_estacion) }}</p>
    </mat-card-content>
  </mat-card>

  <mat-card appearance="outlined" class="tarjeta">
    <mat-card-header>
      <mat-card-title>Guardias asignados</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="a.guardias ?? []">
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let g">{{ g.nombre }}</td>
        </ng-container>
        <ng-container matColumnDef="turno">
          <th mat-header-cell *matHeaderCellDef>Turno</th>
          <td mat-cell *matCellDef="let g">{{ g.turno }}</td>
        </ng-container>
        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef>Asignado desde</th>
          <td mat-cell *matCellDef="let g">{{ g.fecha_asignacion }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columnasGuardias"></tr>
        <tr mat-row *matRowDef="let row; columns: columnasGuardias"></tr>
      </table>
    </mat-card-content>
  </mat-card>
}
