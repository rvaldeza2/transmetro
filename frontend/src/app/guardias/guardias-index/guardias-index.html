<div class="encabezado">
  <h2>Guardias de seguridad</h2>
  <a mat-flat-button routerLink="crear"><mat-icon>add</mat-icon> Nuevo guardia</a>
</div>

<mat-form-field>
  <mat-label>Buscar</mat-label>
  <input matInput #filtro (input)="filtrar(filtro.value)" />
</mat-form-field>

<table mat-table [dataSource]="guardias" matSort>
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
    <td mat-cell *matCellDef="let g">{{ g.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="turno">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Turno</th>
    <td mat-cell *matCellDef="let g">{{ g.turno }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let g" class="acciones">
      <a mat-icon-button [routerLink]="[g.id_guardia]"><mat-icon>visibility</mat-icon></a>
      <a mat-icon-button [routerLink]="['editar', g.id_guardia]"><mat-icon>edit</mat-icon></a>
      <button mat-icon-button (click)="eliminar(g)"><mat-icon>delete</mat-icon></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" [attr.colspan]="columnas.length">No hay registros que coincidan con "{{ filtro.value }}"</td>
  </tr>
</table>
<mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
