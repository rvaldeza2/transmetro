@if (guardia(); as g) {
  <div class="encabezado">
    <h2>Guardia {{ g.nombre }}</h2>
    <div class="fila">
      <a mat-button [routerLink]="['/guardias', 'editar', id]"><mat-icon>edit</mat-icon> Editar</a>
      <a mat-button routerLink="/guardias"><mat-icon>arrow_back</mat-icon> Volver</a>
    </div>
  </div>

  <mat-card appearance="outlined" class="tarjeta">
    <mat-card-content>
      <p><strong>Nombre:</strong> {{ g.nombre }}</p>
      <p><strong>Turno:</strong> {{ g.turno ?? 'Sin turno asignado' }}</p>
    </mat-card-content>
  </mat-card>
}
