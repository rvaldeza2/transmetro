<h2>{{ id ? 'Editar guardia' : 'Nuevo guardia' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()" class="formulario">
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="nombre" />
    <mat-error>El nombre es obligatorio</mat-error>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Turno</mat-label>
    <mat-select formControlName="turno">
      @for (turno of turnos; track turno) {
        <mat-option [value]="turno">{{ turno }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <div class="botones">
    <a mat-button routerLink="/guardias">Cancelar</a>
    <button mat-flat-button type="submit">Guardar</button>
  </div>
</form>
