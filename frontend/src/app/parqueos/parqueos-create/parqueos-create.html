<h2>{{ id ? 'Editar parqueo' : 'Nuevo parqueo' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()" class="formulario">
  <mat-form-field>
    <mat-label>Ubicación</mat-label>
    <input matInput formControlName="ubicacion" />
    <mat-error>La ubicación es obligatoria</mat-error>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Estación</mat-label>
    <mat-select formControlName="id_estacion">
      @for (estacion of estaciones(); track estacion.id_estacion) {
        <mat-option [value]="estacion.id_estacion">{{ estacion.nombre }}</mat-option>
      }
    </mat-select>
    <mat-error>La estación es obligatoria</mat-error>
  </mat-form-field>

  <div class="botones">
    <a mat-button routerLink="/parqueos">Cancelar</a>
    <button mat-flat-button type="submit">Guardar</button>
  </div>
</form>
